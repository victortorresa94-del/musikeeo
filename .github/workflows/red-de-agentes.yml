# La red de agentes del ENTORNO DE PRUEBAS (Firebase «musikeeo-pruebas», nunca producción):
# cada 4 horas los agentes publican, miran el Feed y dan me gusta y comentan.
# Mientras no estén los secretos PRUEBAS_FIREBASE_*, no hace nada. Guía: docs/AGENTES.md
name: Red de agentes (pruebas)

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      rondas:
        description: Rondas seguidas
        default: '2'

permissions:
  contents: read

concurrency:
  group: red-de-agentes
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Los agentes usan la app
        run: node scripts/agentes/red-social.ts --entorno=pruebas --rondas=${{ inputs.rondas || '2' }}
        env:
          PRUEBAS_FIREBASE_PROJECT_ID: ${{ secrets.PRUEBAS_FIREBASE_PROJECT_ID }}
          PRUEBAS_FIREBASE_API_KEY: ${{ secrets.PRUEBAS_FIREBASE_API_KEY }}
          PRUEBAS_FIREBASE_AUTH_DOMAIN: ${{ secrets.PRUEBAS_FIREBASE_AUTH_DOMAIN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.moonshot.ai/v1
          LLM_MODEL: kimi-k2-turbo-preview
